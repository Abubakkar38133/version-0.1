name: Build and publish Little Quest Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.example --project-name=little_quest build_app

      - name: Install Little Quest source
        run: |
          cp app/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -R app/lib build_app/lib
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' build_app/android/app/src/main/AndroidManifest.xml

      - name: Configure persistent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > build_app/android/app/upload-keystore.jks
          cat > build_app/android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("build_app/android/app/build.gradle.kts")
          s = p.read_text()

          imports = """import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              s = imports + s

          signing = """signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }"""

          # Replace Flutter's generated signingConfigs block, if present.
          match = re.search(r"(?m)^\\s*signingConfigs\\s*\\{", s)
          if match:
              brace = s.find("{", match.start())
              depth = 0
              block_end = None
              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          block_end = i + 1
                          break
              if block_end is None:
                  raise SystemExit("Could not parse existing signingConfigs block")
              s = s[:match.start()] + signing + s[block_end:]
          else:
              android = s.find("android {")
              if android < 0:
                  raise SystemExit("Could not find android block")
              build_types = s.find("buildTypes {", android)
              if build_types < 0:
                  raise SystemExit("Could not find buildTypes block")
              s = s[:build_types] + "    " + signing + "\\n    " + s[build_types:]

          # Ensure release builds use the persistent key, not Flutter's debug key.
          bt = s.find("buildTypes {")
          if bt < 0:
              raise SystemExit("Could not find buildTypes block")
          rel = s.find("release {", bt)
          if rel < 0:
              raise SystemExit("Could not find release build type")
          close = s.find("}", rel)
          if close < 0:
              raise SystemExit("Could not find end of release build type")
          section = s[rel:close]
          section = re.sub(
              r"signingConfig\\s*=\\s*signingConfigs\\.getByName\\(\\"[^\\"]+\\"\\)",
              'signingConfig = signingConfigs.getByName("release")',
              section
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in section:
              section += '\\n        signingConfig = signingConfigs.getByName("release")'
          s = s[:rel] + section + s[close:]
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build signed release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-quest-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Little Quest v0.2.0
          target_commitish: ${{ github.sha }}
          files: build_app/build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
