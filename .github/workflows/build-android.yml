name: Build Little Quest Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract MVP source
        run: |
          mkdir -p source
          unzip -q Little_Quest_MVP_Source.zip -d source
          test -f source/pubspec.yaml
          test -f source/lib/main.dart

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=little_quest app

      - name: Add MVP app code
        run: |
          cp source/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib
          cp -R source/lib app/lib

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-quest-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
